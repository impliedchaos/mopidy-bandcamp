[tox]
envlist = py313, flake8

[testenv]
passenv = *
sitepackages = true
deps =
    pytest
    pytest-cov
    mopidy >= 4.0.0
    setuptools < 82

commands =
    python -m pytest \
        --basetemp={envtmpdir} \
        --cov=mopidy_bandcamp --cov-report=term-missing \
        {posargs}

[testenv:flake8]
deps =
    flake8
commands = python -m flake8 --show-source --statistics
